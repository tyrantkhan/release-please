# Keeps this fork current with googleapis/release-please without touching the
# pull request branch by hand:
#   - `main` mirrors upstream main (fast-forward only; this branch is never on it).
#   - `feat/pull-request-group` (googleapis/release-please#2904) is rebased onto
#     upstream main whenever it falls behind, tested, and force-pushed with a
#     lease when the rebase is clean.
#   - A rebase conflict opens one issue here and leaves the branch alone.
#   - Pushes use a write deploy key (secret SYNC_DEPLOY_KEY): the workflow
#     token may not push refs that change workflow files, and mirrors do.
#   - Upstream tags are mirrored, and every upstream release from
#     FIRST_VERSION on gets a patched counterpart `vX.Y.Z-pr<PR>.N` (the tag
#     plus the pull request's patch, tested) with the CLI bundled by ncc and
#     attached to a GitHub release. The tag's tree also carries the compiled
#     output, so `npm install github:<fork>#vX.Y.Z-pr<PR>.N` is a drop-in for
#     `release-please@X.Y.Z`; a consumer moves between upstream and the patched
#     build by adding or dropping the suffix.
# This branch is the fork's default only so the schedule runs; it carries
# nothing else.
name: Sync with upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/googleapis/release-please.git
  PR_BRANCH: feat/pull-request-group
  PR_NUMBER: '2904'
  # Upstream releases older than this get no counterpart.
  FIRST_VERSION: 17.11.2

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push over SSH with the write deploy key
        # The workflow token may not push refs that add or change workflow
        # files, which upstream tags and main do; a deploy key may.
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SYNC_DEPLOY_KEY" > ~/.ssh/sync_key && chmod 600 ~/.ssh/sync_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Mirror main from upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          # A plain push refuses anything that is not a fast-forward, which is
          # the point: main must never carry commits of its own.
          git push origin upstream/main:refs/heads/main

      - name: Rebase the pull request branch
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "$PR_BRANCH"
          git checkout -q -B "$PR_BRANCH" "origin/$PR_BRANCH"
          behind=$(git rev-list --count "$PR_BRANCH..upstream/main")
          echo "behind upstream main by $behind commit(s)"
          if [ "$behind" -eq 0 ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rebase --quiet upstream/main; then
            echo "result=rebased" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | tee conflicts.txt
            git rebase --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.rebase.outputs.result == 'rebased'
        with:
          node-version: 22

      - name: Test the rebased branch
        if: steps.rebase.outputs.result == 'rebased'
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Push the rebased branch
        if: steps.rebase.outputs.result == 'rebased'
        run: git push --force-with-lease origin "$PR_BRANCH"

      - name: Open an issue on conflict
        if: steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Rebase of $PR_BRANCH onto upstream main conflicts"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "an open issue already reports this"
            exit 0
          fi
          {
            echo "The daily sync could not rebase \`$PR_BRANCH\` onto upstream main cleanly. Conflicting files:"
            echo
            sed 's/^/- /' conflicts.txt
            echo
            echo "Rebase by hand, then the next run resumes."
          } > body.md
          gh issue create --title "$title" --body-file body.md

  patched-releases:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push over SSH with the write deploy key
        # The workflow token may not push refs that add or change workflow
        # files, which upstream tags and main do; a deploy key may.
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SYNC_DEPLOY_KEY" > ~/.ssh/sync_key && chmod 600 ~/.ssh/sync_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Mirror upstream tags
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main --tags
          # Existing tags are no-ops; a tag that already exists here with a
          # different object is rejected, which is the right outcome.
          git push --quiet origin --tags

      - name: Pick upstream releases that lack a counterpart for the current patch
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin "$PR_BRANCH"
          base=$(git merge-base upstream/main "origin/$PR_BRANCH")
          patch_id=$(git diff "$base" "origin/$PR_BRANCH" -- src schemas | git patch-id --stable | cut -d' ' -f1 | cut -c1-12)
          echo "patch-id of $PR_BRANCH: $patch_id"
          todo=""
          for t in $(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
            v="${t#v}"
            # stop at the first release below the floor (the list is newest first)
            if [ "$(printf '%s\n%s\n' "$FIRST_VERSION" "$v" | sort -V | head -1)" != "$FIRST_VERSION" ]; then
              break
            fi
            latest=$(git tag --list "${t}-pr${PR_NUMBER}.*" --sort=-v:refname | head -1)
            if [ -n "$latest" ]; then
              built=$(git tag -l --format='%(contents:subject)' "$latest" | sed -n 's/.*patch-id=\([0-9a-f]*\).*/\1/p')
              if [ "$built" = "$patch_id" ]; then
                # Same patch already tagged; finish it only if its release is missing.
                if gh release view "$latest" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  continue
                fi
                n=${latest##*.}
              else
                n=$(( ${latest##*.} + 1 ))
              fi
            else
              n=1
            fi
            todo="$todo ${t}:${n}"
          done
          echo "to build:${todo:- nothing}"
          {
            echo "todo=${todo}"
            echo "patch_id=${patch_id}"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pick.outputs.todo != ''
        with:
          node-version: 22

      - name: Build, test, bundle and release each counterpart
        if: steps.pick.outputs.todo != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ID: ${{ steps.pick.outputs.patch_id }}
          BASE: ${{ steps.pick.outputs.base }}
          TODO: ${{ steps.pick.outputs.todo }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t patch_commits < <(git rev-list --reverse "$BASE..origin/$PR_BRANCH")
          failed=""
          for item in $TODO; do
            t="${item%%:*}"; n="${item##*:}"; name="${t}-pr${PR_NUMBER}.${n}"
            echo "::group::${name}"
            git checkout -q --detach "$t"
            if ! git cherry-pick --no-edit "${patch_commits[@]}"; then
              git cherry-pick --abort
              echo "::warning::${name}: the patch does not apply to ${t}; skipped"
              failed="$failed $name"; echo "::endgroup::"; continue
            fi
            npm ci --no-audit --no-fund
            npm test
            # Commit the compiled output on the tag so the tag installs like the
            # npm package: `npm install github:<fork>#vX.Y.Z-pr<PR>.N` is a drop-in
            # for `release-please@X.Y.Z` (the package has no prepare script).
            find build/src -name '*.map' -delete
            git add -f build/src
            git commit -q -m "build: compiled output for ${name}"
            rm -rf dist && npx --yes @vercel/ncc@0.38.3 build build/src/bin/release-please.js -o dist
            # yargs reports the nearest package.json's version; give the bundle its own.
            printf '{"name":"release-please","version":"%s","private":true}\n' "${t#v}" > dist/package.json
            (cd dist && node index.js --version | grep -qx "${t#v}")
            asset="release-please-cli-${name#v}.tar.gz"
            tar -czf "$asset" -C dist .
            sha256sum "$asset" > "$asset.sha256"
            if git rev-parse -q --verify "refs/tags/$name" >/dev/null; then
              echo "tag $name exists; creating its release"
            else
              git tag -a "$name" -m "upstream ${t} + googleapis/release-please#${PR_NUMBER} patch-id=${PATCH_ID}"
              git push --quiet origin "$name"
            fi
            gh release create "$name" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "$name" \
              --notes "Upstream ${t} plus googleapis/release-please#${PR_NUMBER} (patch-id ${PATCH_ID}). The asset is the CLI bundled by ncc: run \`node index.js release-pr ...\` / \`node index.js github-release ...\` after extracting."
            rm -f "$asset" "$asset.sha256"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::patch did not apply to:${failed}"
            exit 1
          fi
