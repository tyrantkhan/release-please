# Keeps this fork current with googleapis/release-please without touching the
# pull request branch by hand:
#   - `main` mirrors upstream main (fast-forward only; this branch is never on it).
#   - `feat/pull-request-group` (googleapis/release-please#2904) is rebased onto
#     upstream main whenever it falls behind, tested, and force-pushed with a
#     lease when the rebase is clean.
#   - A rebase conflict opens one issue here and leaves the branch alone.
#   - Pushes use a write deploy key (secret SYNC_DEPLOY_KEY): the workflow
#     token may not push refs that change workflow files, and mirrors do.
#   - Upstream tags below FIRST_VERSION are mirrored as they are. From
#     FIRST_VERSION on, the fork's `vX.Y.Z` tag is upstream `vX.Y.Z` plus the
#     pull request's patch, tested, with the compiled output committed on the
#     tag (so `npm install github:<fork>#vX.Y.Z` is a drop-in for
#     `release-please@X.Y.Z`) and the CLI bundled by ncc on a release of the
#     same name. Switching between upstream and the fork changes only the
#     source, never the version. A version is built once; dispatch with
#     `rebuild` to redo one after the patch changes.
# This branch is the fork's default only so the schedule runs; it carries
# nothing else.
name: Sync with upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Upstream version to rebuild from scratch, e.g. v17.11.2 (its tag and release are replaced)
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/googleapis/release-please.git
  PR_BRANCH: feat/pull-request-group
  PR_NUMBER: '2904'
  # Upstream releases from this version on are rebuilt with the patch under
  # the same tag; older ones are mirrored unchanged.
  FIRST_VERSION: 17.11.2

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push over SSH with the write deploy key
        # The workflow token may not push refs that add or change workflow
        # files, which upstream tags and main do; a deploy key may.
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SYNC_DEPLOY_KEY" > ~/.ssh/sync_key && chmod 600 ~/.ssh/sync_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Mirror main from upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          # A plain push refuses anything that is not a fast-forward, which is
          # the point: main must never carry commits of its own.
          git push origin upstream/main:refs/heads/main

      - name: Rebase the pull request branch
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "$PR_BRANCH"
          git checkout -q -B "$PR_BRANCH" "origin/$PR_BRANCH"
          behind=$(git rev-list --count "$PR_BRANCH..upstream/main")
          echo "behind upstream main by $behind commit(s)"
          if [ "$behind" -eq 0 ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rebase --quiet upstream/main; then
            echo "result=rebased" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | tee conflicts.txt
            git rebase --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.rebase.outputs.result == 'rebased'
        with:
          node-version: 22

      - name: Test the rebased branch
        if: steps.rebase.outputs.result == 'rebased'
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Push the rebased branch
        if: steps.rebase.outputs.result == 'rebased'
        run: git push --force-with-lease origin "$PR_BRANCH"

      - name: Open an issue on conflict
        if: steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Rebase of $PR_BRANCH onto upstream main conflicts"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "an open issue already reports this"
            exit 0
          fi
          {
            echo "The daily sync could not rebase \`$PR_BRANCH\` onto upstream main cleanly. Conflicting files:"
            echo
            sed 's/^/- /' conflicts.txt
            echo
            echo "Rebase by hand, then the next run resumes."
          } > body.md
          gh issue create --title "$title" --body-file body.md

  patched-releases:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push over SSH with the write deploy key
        # The workflow token may not push refs that add or change workflow
        # files, which upstream tags and main do; a deploy key may.
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SYNC_DEPLOY_KEY" > ~/.ssh/sync_key && chmod 600 ~/.ssh/sync_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Mirror upstream tags below FIRST_VERSION
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          # Upstream tags land in their own namespace so the fork's patched tags
          # are never overwritten by a mirror.
          git fetch --quiet upstream '+refs/tags/*:refs/upstream-tags/*'
          refspecs=""
          for r in $(git for-each-ref --format='%(refname)' refs/upstream-tags); do
            t="${r#refs/upstream-tags/}"
            v="${t#v}"
            # keep only versions strictly below the floor
            if [ "$(printf '%s\n%s\n' "$v" "$FIRST_VERSION" | sort -V | head -1)" = "$v" ] && [ "$v" != "$FIRST_VERSION" ]; then
              refspecs="$refspecs $r:refs/tags/$t"
            fi
          done
          # shellcheck disable=SC2086 # one refspec per word by construction
          git push --quiet origin $refspecs

      - name: Pick versions from FIRST_VERSION on that the fork has not patched
        id: pick
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          git fetch --quiet origin "$PR_BRANCH"
          base=$(git merge-base upstream/main "origin/$PR_BRANCH")
          patch_id=$(git diff "$base" "origin/$PR_BRANCH" -- src schemas | git patch-id --stable | cut -d' ' -f1 | cut -c1-12)
          echo "patch-id of $PR_BRANCH: $patch_id"
          todo=""
          for r in $(git for-each-ref --format='%(refname)' --sort=-v:refname refs/upstream-tags); do
            t="${r#refs/upstream-tags/}"
            v="${t#v}"
            if [ "$(printf '%s\n%s\n' "$FIRST_VERSION" "$v" | sort -V | head -1)" != "$FIRST_VERSION" ]; then
              break
            fi
            if [ "$t" = "$REBUILD" ]; then
              todo="$todo $t"
              continue
            fi
            # A fork tag whose message names a patch-id is one of our builds.
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null \
               && git tag -l --format='%(contents:subject)' "$t" | grep -q 'patch-id='; then
              continue
            fi
            todo="$todo $t"
          done
          echo "to build:${todo:- nothing}"
          {
            echo "todo=${todo}"
            echo "patch_id=${patch_id}"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pick.outputs.todo != ''
        with:
          node-version: 22

      - name: Build, test, tag and release each version
        if: steps.pick.outputs.todo != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ID: ${{ steps.pick.outputs.patch_id }}
          BASE: ${{ steps.pick.outputs.base }}
          TODO: ${{ steps.pick.outputs.todo }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t patch_commits < <(git rev-list --reverse "$BASE..origin/$PR_BRANCH")
          failed=""
          for t in $TODO; do
            v="${t#v}"
            echo "::group::${t}"
            git checkout -q --detach "refs/upstream-tags/$t"
            if ! git cherry-pick --no-edit "${patch_commits[@]}"; then
              git cherry-pick --abort
              echo "::warning::${t}: the patch does not apply; skipped"
              failed="$failed $t"; echo "::endgroup::"; continue
            fi
            npm ci --no-audit --no-fund
            npm test
            # Commit the compiled output on the tag so the tag installs like the
            # npm package (the package has no prepare script).
            find build/src -name '*.map' -delete
            git add -f build/src
            git commit -q -m "build: compiled output for ${t}"
            rm -rf dist && npx --yes @vercel/ncc@0.38.3 build build/src/bin/release-please.js -o dist
            # yargs reports the nearest package.json's version; give the bundle its own.
            printf '{"name":"release-please","version":"%s","private":true}\n' "$v" > dist/package.json
            (cd dist && node index.js --version | grep -qx "$v")
            asset="release-please-cli-${v}.tar.gz"
            tar -czf "$asset" -C dist .
            sha256sum "$asset" > "$asset.sha256"
            git tag -f -a "$t" -m "upstream ${t} + googleapis/release-please#${PR_NUMBER} patch-id=${PATCH_ID}"
            git push --quiet --force origin "refs/tags/$t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release create "$t" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "$t" \
              --notes "Upstream ${t} plus googleapis/release-please#${PR_NUMBER} (patch-id ${PATCH_ID}). The tag installs like release-please@${v} (\`npm install github:${GITHUB_REPOSITORY}#${t}\`); the asset is the CLI bundled by ncc: extract, then \`node index.js release-pr ...\` and \`node index.js github-release ...\`."
            rm -f "$asset" "$asset.sha256"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::patch did not apply to:${failed}"
            exit 1
          fi
